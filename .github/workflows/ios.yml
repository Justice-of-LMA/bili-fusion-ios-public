name: Build iOS IPA
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run simulator unit tests
        required: true
        type: boolean
        default: true
      live_soak:
        description: 7777/6 native playback for five minutes (no chat sending)
        type: boolean
        default: false
      login:
        description: User-authorized QR login on this temporary runner before the live test
        type: boolean
        default: false
      compatibility:
        description: Also test iPadOS 27 preview
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ios-manual-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      FUSION_LIVE_SOAK: ${{ inputs.live_soak && '1' || '0' }}
      FUSION_LIVE_LOGIN: ${{ inputs.live_soak && inputs.login && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate user-requested Bilibili login QR
        if: inputs.live_soak && inputs.login
        run: swift scripts/live-login.swift generate
      - uses: actions/upload-artifact@v4
        if: inputs.live_soak && inputs.login
        with:
          name: ios-bili-login-qr-${{ github.run_id }}
          path: login-qr/ios-bili-qr.png
          retention-days: 1
      - name: Wait for user to scan and confirm Bilibili login
        if: inputs.live_soak && inputs.login
        run: swift scripts/live-login.swift poll
      - name: Local JavaScript checks
        run: |
          node --check Fusion/Web/app.js
          node --check Fusion/Web/ios-media.js
          node --test Tests/*.test.cjs
      - uses: actions/cache/restore@v4
        id: voice-cache
        with:
          path: Vendor/ffmpeg
          key: voice-8.1.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-voice.sh') }}
      - name: Build local audio filter dependency
        run: bash scripts/build-voice.sh
      - uses: actions/cache/save@v4
        if: steps.voice-cache.outputs.cache-hit != 'true'
        with:
          path: Vendor/ffmpeg
          key: voice-8.1.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-voice.sh') }}
      - name: Generate Xcode project
        run: |
          swift scripts/make-icon.swift
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Build device executable
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild -project Fusion.xcodeproj -scheme Fusion -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build > artifacts/device-build.log 2>&1 || { tail -100 artifacts/device-build.log; exit 1; }
      - name: Simulator tests
        if: inputs.run_tests
        run: bash scripts/test-simulator.sh
      - name: Package unsigned IPA for user re-signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Fusion.app build/package/Payload/
          file build/package/Payload/Fusion.app/Fusion | tee artifacts/executable.txt
          lipo -archs build/package/Payload/Fusion.app/Fusion | grep -w arm64
          cd build/package
          zip -qr ../../artifacts/BiliFusion-iOS-0.2.5-unsigned.ipa Payload
          cd ../..
          python3 scripts/verify-ipa.py artifacts/BiliFusion-iOS-0.2.5-unsigned.ipa > artifacts/verification.json
          shasum -a 256 artifacts/*.ipa > artifacts/SHA256SUMS.txt
      - name: Discard temporary login session
        if: always() && inputs.login
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'fusion-live-login'
          for name in ['challenge.json', 'session.json']:
              (directory / name).unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-${{ github.run_number }}
          path: artifacts/
          retention-days: 1
          if-no-files-found: ignore
  compatibility-27:
    if: inputs.run_tests && inputs.compatibility
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      FUSION_TEST_IOS_MAJOR: "27"
      FUSION_LIVE_SOAK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: voice-cache
        with:
          path: Vendor/ffmpeg
          key: voice27-8.1.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-voice.sh') }}
      - name: Build local audio filter dependency
        run: bash scripts/build-voice.sh
      - uses: actions/cache/save@v4
        if: steps.voice-cache.outputs.cache-hit != 'true'
        with:
          path: Vendor/ffmpeg
          key: voice27-8.1.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-voice.sh') }}
      - name: Generate compatibility test project
        run: |
          swift scripts/make-icon.swift
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: iPadOS 27 preview compatibility tests
        run: bash scripts/test-simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios27-compatibility-${{ github.run_number }}
          path: artifacts/
          retention-days: 1
          if-no-files-found: ignore
